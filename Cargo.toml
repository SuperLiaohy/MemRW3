[package]
name = "MemRW3"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
crossbeam-queue = "0.3"
gimli = "0.31"
gimli-debug = { package = "gimli", version = "0.32" }
object = { version = "0.36", features = ["read", "elf"] }
eframe = "0.34"
egui_ltreeview = "0.7.0"
probe-rs = "=0.31.0"
probe-rs-debug = "=0.31.0"
capstone = { version = "0.14", default-features = false, features = ["std", "full", "arch_arm", "arch_arm64", "arch_riscv"] }
typed-path = "0.12"
egui_plot = "0.35.0"
egui-notify = "0.22"
fontdb = "0.24"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
svd-parser = { version = "0.14.10", features = ["expand"] }
ttf-parser = "0.25"
